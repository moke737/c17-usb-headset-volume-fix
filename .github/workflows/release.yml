name: Build & release module

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(sed -n 's/^version=//p' module.prop)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build module zip
        run: |
          set -euo pipefail
          NAME="c17_usb_volume_fix-${{ steps.ver.outputs.tag }}"
          mkdir -p out
          zip -r "out/${NAME}.zip" \
            module.prop \
            customize.sh \
            post-fs-data.sh \
            service.sh \
            audio_policy_volumes.xml \
            system \
            META-INF
          echo "--- archive contents ---"
          unzip -l "out/${NAME}.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          # Idempotent: a re-pushed tag updates the existing release instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - replacing assets"
            gh release upload "$TAG" out/*.zip --clobber
          else
            gh release create "$TAG" out/*.zip --title "$TAG" --generate-notes
          fi

      - name: Upload artifact (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: out/*.zip
